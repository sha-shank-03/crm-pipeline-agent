name: Offline CRM verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Provision pinned libraries and compile
        run: |
          python tools/bootstrap.py --fetch-deps
          python tools/build.py
          python crm.py doctor
      - name: Current source provenance and pure read-only contracts
        run: |
          python tools/check_current_upgrade.py
          python -m unittest tests.test_salesforce_contract tests.test_evidence_workflow tests.test_upgrade_evaluation tests.test_u2b_summary tests.test_cached_packaging tests.test_provenance_cli tests.test_upgrade_provenance tests.test_m3_release -v
      - name: Complete retained regression and local transport doubles
        run: |
          python tools/check.py --suite all
          python -m unittest tests.test_ai_gateway tests.test_upgrade_events tests.test_upgrade_transport tests.test_upgrade_journey tests.test_gateway_cli tests.test_salesforce_http -v
      - name: Fresh documented local demonstrations
        run: |
          python crm.py demo --scenario approved-update --provider scripted --scripted-review --out work/ci-approved
          python crm.py demo --scenario stale-approval --provider scripted --scripted-review --out work/ci-stale
          python tools/upgrade_check.py --offline --out work/ci-gateway-double
      - name: Standalone source packaging audit
        run: |
          python tools/check.py --suite release
